name: moussiqa
services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.40.6
    ports:
      - "127.0.0.1:${POCKETBASE_PORT:-8090}:8090"
    volumes:
      - pb_data:/pb_data
      - ./backend/pb_hooks:/pb_hooks:ro
    command: serve --http=0.0.0.0:8090 --dir=/pb_data --hooksDir=/pb_hooks
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      - pocketbase
    restart: unless-stopped
volumes:
  pb_data:
